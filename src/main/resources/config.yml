# VoidEconomy Configuration
# Dynamic currencies: add any currency here and its commands will be registered automatically.
# Each currency gets: /<command>, /<command>top
# Permissions: voideconomy.<currency_id>.<action>
#   Actions: balance.others, give, add, take, remove, set, reset, clear, top

settings:
  # How often (in seconds) dirty player data is flushed to the database
  auto-save-interval: 300
  # How often (in seconds) the top-list cache is refreshed
  top-cache-refresh: 300

database:
  # SQLite database file name (relative to plugin folder)
  file: "economy.db"

# Global messages (used when no per-currency override exists)
messages:
  no-permission: "&cYou don't have permission to do this."
  player-not-found: "&cPlayer &e{player}&c was not found."
  invalid-amount: "&cInvalid amount. Please enter a positive number."
  amount-too-large: "&cThat amount exceeds the maximum allowed balance."
  console-must-specify-player: "&cConsole must specify a player."

# Define your currencies below.
# The key (e.g. "money") becomes the currency ID used in permissions.
currencies:
  money:
    display-name: "&6Money"
    symbol: "$"
    # The command players type (e.g. /money, /moneytop)
    command: "money"
    # Starting balance for new players
    default-balance: 0.0
    # Maximum allowed balance (-1 = unlimited)
    max-balance: -1
    # Decimal places shown when formatting amounts
    decimals: 2
    messages:
      balance-self: "&aYour balance: &6{symbol}{amount}"
      balance-other: "&a{player}'s balance: &6{symbol}{amount}"
      given: "&aGave &6{symbol}{amount}&a to &6{player}&a."
      taken: "&aTook &6{symbol}{amount}&a from &6{player}&a."
      set: "&aSet &6{player}&a's balance to &6{symbol}{amount}&a."
      reset: "&aReset &6{player}&a's balance to the default (&6{symbol}{default}&a)."
      cleared: "&aCleared &6{player}&a's balance."
      received-give: "&aAn admin gave you &6{symbol}{amount}&a."
      received-take: "&cAn admin took &6{symbol}{amount}&c from you."
      top-header: "&6&l--- Top {limit} {display-name} ---"
      top-entry: "&6#{rank} &e{player} &7- &6{symbol}{amount}"
      top-footer: "&6&m                              "
      top-empty: "&cNo balance data found yet."

  tokens:
    display-name: "&bTokens"
    symbol: "T"
    command: "tokens"
    default-balance: 0.0
    max-balance: -1
    decimals: 0
    messages:
      balance-self: "&aYour tokens: &b{amount}{symbol}"
      balance-other: "&a{player}'s tokens: &b{amount}{symbol}"
      given: "&aGave &b{amount}{symbol}&a to &6{player}&a."
      taken: "&aTook &b{amount}{symbol}&a from &6{player}&a."
      set: "&aSet &6{player}&a's tokens to &b{amount}{symbol}&a."
      reset: "&aReset &6{player}&a's tokens to the default (&b{default}{symbol}&a)."
      cleared: "&aCleared &6{player}&a's tokens."
      received-give: "&aAn admin gave you &b{amount}{symbol}&a."
      received-take: "&cAn admin took &b{amount}{symbol}&c from you."
      top-header: "&b&l--- Top {limit} {display-name} ---"
      top-entry: "&b#{rank} &e{player} &7- &b{amount}{symbol}"
      top-footer: "&b&m                              "
      top-empty: "&cNo token data found yet."
